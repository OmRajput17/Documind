name: CI

on:
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main
            - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run validation tests
        run: uv run python -m src.test.test_input_validation

      - name: Run PII tests
        run: uv run python -m src.test.test_pii_masking

      - name: Run prompt injection tests
        run: uv run python -m src.test.test_prompt_injection

      - name: Run BM25 tests
        run: uv run python -m src.test.test_bm25_retriever
